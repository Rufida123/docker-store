# Client authentication for the PRIMARY (db). Mounted read-only and selected
# with "-c hba_file=..." so it also applies to an existing data volume, where
# docker-entrypoint-initdb.d scripts no longer run.
#
# Same rules as the postgres image's default file, plus one line: the replica
# (db_replica) may open a replication connection with a password.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256
