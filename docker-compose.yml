services:
  db:
    image: postgres:16-alpine
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Primary of the streaming replication (docs/performance.md, 6.6).
    # wal_level=replica is already PostgreSQL 16's default; the hba file adds
    # the replication login; max_slot_wal_keep_size caps the WAL a stopped
    # replica can make the primary keep (beyond it the slot is invalidated
    # and the replica must be rebuilt, see README), so it can't fill the disk.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata_laravel:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: laravel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-environment
      APP_NAME: "Docker Store"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # Firebase push notifications (optional): put the service account JSON in ./secrets
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
      # Inventory service (gRPC). No hard dependency: the catalog still serves
      # with the inventory down, so the backend starts regardless.
      INVENTORY_GRPC_ADDR: inventory:50051
      INVENTORY_TIMEOUT_MS: 2000
      INVENTORY_CONNECT_TIMEOUT_MS: 500
      # Load tests only: X-Query-Count / X-Query-Time-Ms headers (docs/performance.md).
      PERF_QUERY_LOG: ${PERF_QUERY_LOG:-false}
      # Read replica (docs/performance.md, 6.6): reads may go to db_replica,
      # writes always go to db. Empty = one connection to the primary. The
      # API never depends on the replica: if it is down, reads use db.
      DB_READ_HOST: ${DB_READ_HOST-db_replica} # "DB_READ_HOST=" turns the replica off
      # Catalog cache (docs/performance.md, 6.4). Without Redis the API keeps
      # serving from the database, so there is no hard dependency on it.
      REDIS_HOST: redis
      CATALOG_CACHE_STORE: ${CATALOG_CACHE_STORE:-catalog}
    ports:
      - "${PORT}:3000"
    volumes:
      - uploads_laravel:/app/uploads # uploaded product images survive rebuilds
      - ./secrets:/run/secrets:ro    # never committed (see .gitignore)

  # Same image as backend; delivers parked inventory releases every minute.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: laravel_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["php", "artisan", "schedule:work"]
    # The outbox and every scheduled job read and write on the primary only.
    environment:
      <<: *backend-environment
      DB_READ_HOST: ""
    volumes:
      - ./secrets:/run/secrets:ro

  # Cache for the product catalog. Data is disposable: no volume, and an
  # eviction policy so it never refuses writes when full.
  redis:
    image: redis:7.4-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hot standby of db (streaming replication), read-only. Built from the
  # official image: the script makes the base backup on first start.
  # REPLICA_APPLY_DELAY=3s delays replay on purpose (demo of replication lag).
  db_replica:
    image: postgres:16-alpine
    container_name: laravel_db_replica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER:?set REPLICATION_USER in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD in .env}
      REPLICA_APPLY_DELAY: ${REPLICA_APPLY_DELAY:-0}
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - replica_pgdata_laravel:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  inventory_db:
    image: postgres:16-alpine
    container_name: laravel_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    volumes:
      - inventory_pgdata_laravel:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: laravel_inventory
    restart: unless-stopped
    depends_on:
      inventory_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory_db:5432/${INVENTORY_DB_NAME}
    ports:
      - "50051:50051" # published for grpcurl demos; the backend uses the service name

  frontend:
    build:
      context: ./frontend
      # Firebase web config (public values, baked into the build). Empty = push turned off.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    container_name: laravel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # ---- load testing (docs/performance.md); only with --profile perf ----

  # Backend image with APP_ENV=perf, for `php artisan perf:seed`.
  #   docker compose --profile perf run --rm perf-tools perf:seed --fresh
  perf-tools:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["perf"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-environment
      APP_ENV: perf
      DB_READ_HOST: "" # perf:seed reads its own temp tables: primary only
    entrypoint: ["php", "artisan"]
    command: ["perf:seed"]

  # k6 load test against the backend on the compose network.
  #   docker compose --profile perf run --rm -e PROFILE=smoke k6
  k6:
    image: grafana/k6:0.54.0
    profiles: ["perf"]
    user: "0" # write results into the bind mount on any host
    environment:
      BASE_URL: ${PERF_BASE_URL:-http://backend:3000/api/v1}
      RESULTS_DIR: /results
    volumes:
      - ./perf/k6:/scripts:ro
      - ./perf/results:/results
    command: ["run", "/scripts/store.js"]

volumes:
  pgdata_laravel:
  replica_pgdata_laravel:
  uploads_laravel:
  inventory_pgdata_laravel:
