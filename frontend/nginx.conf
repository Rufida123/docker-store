server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. With a literal host in proxy_pass, nginx resolves
  # "backend" once at startup and keeps that IP: when the backend container
  # is recreated it gets a new IP and every API call fails with 502 until
  # nginx restarts. A variable in proxy_pass makes nginx resolve the name at
  # request time through this resolver, re-checked every 10 s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  # Forward the versioned /api/v1/* routes to the backend unchanged.
  location /api/ {
    # No URI part after the host: the original request URI is passed unchanged.
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Cache hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single page app fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
